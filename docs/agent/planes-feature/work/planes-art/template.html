<title>Riki Head Planes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
/* Layout: drafting table — the drawing sheet fills the left, a narrow instrument rail on the right; stacks on phones. */
:root {
  --paper: #f6f4ef; --sheet: #fffdf8; --ink: #23211d; --muted: #6b665c; --rule: #d9d3c6;
  --plane: #c8261c; --loomis: #1d5fb8; --cut: #0d8a72; --neck: #7a4cc2; --edited: #e07a00; --sel: #111;
  --chip: #ece7dc;
  --f-display: "Fraunces", Georgia, serif; --f-ui: "Atkinson Hyperlegible", system-ui, sans-serif; --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #191816; --sheet: #22201d; --ink: #ece8df; --muted: #a39d90; --rule: #3a3731;
  --plane: #ff6a5c; --loomis: #6fa8ff; --cut: #3fd3b0; --neck: #b896ff; --edited: #ffb04a; --sel: #fff; --chip: #2d2a26; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #191816; --sheet: #22201d; --ink: #ece8df; --muted: #a39d90; --rule: #3a3731;
  --plane: #ff6a5c; --loomis: #6fa8ff; --cut: #3fd3b0; --neck: #b896ff; --edited: #ffb04a; --sel: #fff; --chip: #2d2a26; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--paper); color: var(--ink); font-family: var(--f-ui); font-size: 15px; padding-inline: 16px; padding-block: 12px 32px }
h1 { font-family: var(--f-display); font-weight: 600; font-size: 1.5rem; margin: 0; text-wrap: balance }
.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin-bottom: 10px }
.sub { color: var(--muted); font-size: .9rem }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px }
.tab { font: inherit; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); border-radius: 6px; padding: 6px 10px; cursor: pointer }
.tab[aria-selected="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink) }
.tab small { font-family: var(--f-mono); opacity: .75; margin-left: 4px }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; align-items: start }
@media (max-width: 820px) { .main { grid-template-columns: minmax(0, 1fr) } }
.stage { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; overflow: auto; max-height: 82vh; min-width: 0; position: relative }
.stage svg { display: block; touch-action: pan-x pan-y }
.rail { display: flex; flex-direction: column; gap: 12px; min-width: 0 }
.box { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px }
.box h2 { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 }
.row { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center }
label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer }
button.b { font: inherit; font-size: .88rem; border: 1px solid var(--rule); background: var(--chip); color: var(--ink); border-radius: 6px; padding: 5px 9px; cursor: pointer }
button.b:focus-visible, .tab:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--loomis); outline-offset: 2px }
textarea, input[type=text] { font: inherit; width: 100%; background: var(--paper); color: var(--ink); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 8px }
textarea { min-height: 96px; resize: vertical }
.mono { font-family: var(--f-mono); font-size: .82rem; font-variant-numeric: tabular-nums }
.status { font-family: var(--f-mono); font-size: .78rem; padding: 2px 8px; border-radius: 99px; background: var(--chip); color: var(--muted) }
.status.ok { color: var(--cut) } .status.warn { color: var(--edited) }
.key { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .82rem; color: var(--muted) }
.badge { font-size: .72rem; padding: 1px 6px; border-radius: 99px; background: var(--edited); color: var(--sheet) }
.hint { font-size: .82rem; color: var(--muted); margin: 0 }
svg .pl { fill: none; stroke: var(--plane); stroke-linejoin: round }
svg .eye { fill: none; stroke: var(--plane) }
svg .iris { fill: none; stroke: var(--plane) }
svg .lm { fill: none; stroke: var(--loomis) }
svg .cut { fill: none; stroke: var(--cut) }
svg .cut.far { stroke-dasharray: 4 3 }
svg .nk { fill: none; stroke: var(--neck) }
svg .h { fill: var(--sheet); stroke: var(--plane); cursor: grab }
svg .h.lmh { stroke: var(--loomis) } svg .h.cuth { stroke: var(--cut) } svg .h.nkh { stroke: var(--neck) }
svg .h.ed { fill: var(--edited) }
svg .h.sel { stroke: var(--sel); fill: var(--sel) }
svg .hit { fill: transparent; cursor: grab }
svg text.lab { font-family: var(--f-mono); fill: var(--ink); paint-order: stroke; stroke: var(--sheet); stroke-width: 3px }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

<div class="top">
  <h1>Riki Head Planes</h1>
  <span class="sub">Drag any point. Edits and notes save per angle.</span>
  <span id="status" class="status">Loading…</span>
</div>
<div class="tabs" id="tabs" role="tablist"></div>
<div class="main">
  <div class="stage" id="stage"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div class="rail">
    <div class="box">
      <h2>Underlay</h2>
      <div class="row">
        <label><input type="radio" name="bg" id="bgPhoto" value="photo" checked> Photo</label>
        <label><input type="radio" name="bg" id="bgLine" value="line"> Line drawing</label>
      </div>
      <label>Fade <input type="range" id="fade" min="0" max="90" value="35"></label>
      <div class="row">
        <button class="b" id="zoomOut" aria-label="Zoom out">−</button>
        <span class="mono" id="zoomLbl">1×</span>
        <button class="b" id="zoomIn" aria-label="Zoom in">+</button>
        <button class="b" id="zoomFit">Fit</button>
      </div>
    </div>
    <div class="box">
      <h2>Layers</h2>
      <div class="row">
        <label><input type="checkbox" id="lyPlanes" checked> Planes</label>
        <label><input type="checkbox" id="lyEyes" checked> Eyes</label>
        <label><input type="checkbox" id="lyLoomis" checked> Loomis sphere</label>
        <label><input type="checkbox" id="lyNeck" checked> Neck</label>
        <label><input type="checkbox" id="lyFar"> Far side</label>
        <label><input type="checkbox" id="lyHandles" checked> Points</label>
        <label><input type="checkbox" id="lyLabels"> Labels</label>
      </div>
      <div class="legend">
        <span><i class="key" style="background:var(--plane)"></i>planes</span>
        <span><i class="key" style="background:var(--loomis)"></i>Loomis</span>
        <span><i class="key" style="background:var(--cut)"></i>side-plane cut</span>
        <span><i class="key" style="background:var(--neck)"></i>neck</span>
        <span><i class="key" style="background:var(--edited)"></i>moved by you</span>
      </div>
    </div>
    <div class="box">
      <h2>Selected point</h2>
      <p class="hint" id="selNone">Tap a point to select it. Arrow keys nudge it by 1 px (Shift: 5 px).</p>
      <div id="selBox" hidden>
        <div class="row"><strong class="mono" id="selKey"></strong><span class="badge" id="selEd" hidden>moved</span></div>
        <div class="mono" id="selXY"></div>
        <input type="text" id="selNote" placeholder="Note on this point">
        <div class="row"><button class="b" id="selReset">Reset point</button></div>
      </div>
    </div>
    <div class="box">
      <h2>Notes for this angle</h2>
      <textarea id="notes" placeholder="What is wrong here, what to change next…"></textarea>
      <div class="row">
        <button class="b" id="resetAngle">Reset this angle</button>
        <button class="b" id="copyJson">Copy JSON</button>
      </div>
      <p class="hint" id="angleInfo"></p>
    </div>
  </div>
</div>

<script id="planes-data" type="application/json">__DATA__</script>
<script>
(() => {
const DATA = JSON.parse(document.getElementById('planes-data').textContent);
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const svg = $('svg');
let cur = 0, zoom = 1, sel = null, db = null, saveTimer = null, resetArm = false;
const state = {};   // angleId -> {edits:{}, notes:'', vnotes:{}}
DATA.angles.forEach(a => state[a.id] = { edits: {}, notes: '', vnotes: {} });

function A() { return DATA.angles[cur] }
function S() { return state[A().id] }
function base(key) {
  const a = A();
  if (a.verts[key]) return a.verts[key];
  if (a.loomis[key]) return a.loomis[key];
  const ir = a.iris.find(i => i.key === key.replace(/R$/, ''));
  if (ir) return key.endsWith('R') ? [ir.c[0] + ir.r, ir.c[1]] : ir.c;
  return null;
}
function pt(key) { return S().edits[key] || base(key) }
function isFar(key) {
  const a = A(); if (Math.abs(a.yaw) < 25) return false;
  return DATA.side[key] === (a.yaw > 0 ? 'R' : 'L');
}
const eyeKey = k => /^(eL|eR)/.test(k);

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(e); return e;
}
function ellipsePts(C, Ap, Bp) {
  const out = [];
  for (let i = 0; i <= 64; i++) { const t = i * Math.PI / 32;
    out.push([C[0] + (Ap[0] - C[0]) * Math.cos(t) + (Bp[0] - C[0]) * Math.sin(t), C[1] + (Ap[1] - C[1]) * Math.cos(t) + (Bp[1] - C[1]) * Math.sin(t)]); }
  return out;
}
const P = pts => pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');

function render() {
  const a = A(), sw = 1.4 / zoom;
  svg.innerHTML = '';
  svg.setAttribute('viewBox', `0 0 ${a.w} ${a.h}`);
  svg.setAttribute('width', a.w * zoom); svg.setAttribute('height', a.h * zoom);
  const bg = $('bgLine').checked ? a.line : a.photo;
  el('image', { href: bg, x: 0, y: 0, width: a.w, height: a.h });
  el('rect', { x: 0, y: 0, width: a.w, height: a.h, fill: 'var(--sheet)', opacity: $('fade').value / 100 });
  const showFar = $('lyFar').checked;
  const visible = pl => showFar || !pl.every(isFar);
  if ($('lyPlanes').checked) DATA.poly.forEach(pl => { if (!pl.every(eyeKey) && visible(pl)) el('polyline', { class: 'pl', points: P(pl.map(pt)), 'stroke-width': sw }); });
  if ($('lyEyes').checked) {
    DATA.poly.forEach(pl => { if (pl.every(eyeKey) && visible(pl)) el('polyline', { class: 'eye', points: P(pl.map(pt)), 'stroke-width': sw }); });
    const defs = el('defs', {});
    a.iris.forEach((ir, j) => {
      if (!showFar && ir.eye.every(isFar)) return;
      const cp = el('clipPath', { id: 'eyeclip' + j }, defs);
      el('polygon', { points: P(ir.eye.map(pt)) }, cp);
      const c = pt(ir.key), rp = pt(ir.key + 'R'), r = Math.hypot(rp[0] - c[0], rp[1] - c[1]);
      el('circle', { class: 'iris', cx: c[0], cy: c[1], r, 'stroke-width': sw * 1.2, 'clip-path': `url(#eyeclip${j})` });
    });
  }
  const L = k => pt(k);
  if ($('lyLoomis').checked) {
    const c = L('sphC'), rp = L('sphR'), r = Math.hypot(rp[0] - c[0], rp[1] - c[1]);
    el('circle', { class: 'lm', cx: c[0], cy: c[1], r, 'stroke-width': sw });
    ['L', 'R'].forEach(s => {
      const far = Math.abs(a.yaw) >= 25 && s === (a.yaw > 0 ? 'R' : 'L');
      el('polyline', { class: 'cut' + (far ? ' far' : ''), points: P(ellipsePts(L(`cut${s}C`), L(`cut${s}A`), L(`cut${s}B`))), 'stroke-width': sw });
    });
    DATA.loomisPoly.forEach(pl => { if (!pl[0].startsWith('nk')) el('polyline', { class: 'lm', points: P(pl.map(L)), 'stroke-width': sw }); });
  }
  if ($('lyNeck').checked) DATA.loomisPoly.forEach(pl => { if (pl[0].startsWith('nk')) el('polyline', { class: 'nk', points: P(pl.map(L)), 'stroke-width': sw * 1.3 }); });
  if ($('lyHandles').checked) drawHandles();
}
function handleKeys() {
  const a = A(), keys = [];
  if ($('lyPlanes').checked || $('lyEyes').checked) Object.keys(a.verts).forEach(k => {
    const eye = eyeKey(k);
    if ((eye && $('lyEyes').checked) || (!eye && $('lyPlanes').checked)) if ($('lyFar').checked || !isFar(k)) keys.push([k, 'h']);
  });
  if ($('lyEyes').checked) a.iris.forEach(ir => { keys.push([ir.key, 'h']); keys.push([ir.key + 'R', 'h']); });
  if ($('lyLoomis').checked) Object.keys(a.loomis).forEach(k => { if (!k.startsWith('nk')) keys.push([k, k.startsWith('cut') ? 'h cuth' : 'h lmh']); });
  if ($('lyNeck').checked) Object.keys(a.loomis).forEach(k => { if (k.startsWith('nk')) keys.push([k, 'h nkh']); });
  return keys;
}
function drawHandles() {
  const r = 3.2 / zoom, hr = 11 / zoom, g = el('g', {});
  for (const [k, cls] of handleKeys()) {
    const p = pt(k);
    const vis = el('circle', { class: cls + (S().edits[k] ? ' ed' : '') + (sel === k ? ' sel' : ''), cx: p[0], cy: p[1], r, 'stroke-width': 1.2 / zoom }, g);
    const hit = el('circle', { class: 'hit', cx: p[0], cy: p[1], r: hr, 'data-k': k, tabindex: 0, role: 'button', 'aria-label': 'Point ' + k }, g);
    if ($('lyLabels').checked) { const t = el('text', { class: 'lab', x: p[0] + 5 / zoom, y: p[1] - 4 / zoom, 'font-size': 9 / zoom }, g); t.textContent = k; }
    hit.addEventListener('pointerdown', ev => startDrag(ev, k));
    hit.addEventListener('focus', () => { if (sel !== k) { sel = k; render(); showSel(); const n = svg.querySelector(`[data-k="${k}"]`); if (n) n.focus(); } });
  }
}
function svgPoint(ev) {
  const r = svg.getBoundingClientRect(), a = A();
  return [(ev.clientX - r.left) * a.w / r.width, (ev.clientY - r.top) * a.h / r.height];
}
let drag = null;
function startDrag(ev, k) {
  ev.preventDefault(); sel = k; showSel();
  const p0 = svgPoint(ev), q0 = pt(k).slice();
  drag = { k, dx: q0[0] - p0[0], dy: q0[1] - p0[1], moved: false, id: ev.pointerId };
  svg.setPointerCapture(ev.pointerId);
  render();
}
svg.addEventListener('pointermove', ev => {
  if (!drag || ev.pointerId !== drag.id) return;
  const p = svgPoint(ev);
  setPoint(drag.k, [p[0] + drag.dx, p[1] + drag.dy], false); drag.moved = true;
});
function endDrag(ev) { if (!drag) return; const m = drag.moved; drag = null; try { svg.releasePointerCapture(ev.pointerId) } catch (e) {} if (m) queueSave(); }
svg.addEventListener('pointerup', endDrag); svg.addEventListener('pointercancel', endDrag);
function setPoint(k, xy, save = true) {
  const r1 = v => Math.round(v * 10) / 10;
  // moving an iris centre or Loomis sphere centre carries its radius handle with it
  const carry = { sphC: 'sphR', cutLC: ['cutLA', 'cutLB'], cutRC: ['cutRA', 'cutRB'] };
  const irisCarry = /^iris\d$/.test(k) ? k + 'R' : null;
  const old = pt(k), d = [xy[0] - old[0], xy[1] - old[1]];
  [].concat(carry[k] || [], irisCarry || []).forEach(c => { const q = pt(c); S().edits[c] = [r1(q[0] + d[0]), r1(q[1] + d[1])]; });
  S().edits[k] = [r1(xy[0]), r1(xy[1])];
  render(); showSel(); if (save) queueSave();
}
function showSel() {
  $('selNone').hidden = !!sel; $('selBox').hidden = !sel; if (!sel) return;
  const p = pt(sel);
  $('selKey').textContent = sel; $('selXY').textContent = `x ${p[0].toFixed(1)}  y ${p[1].toFixed(1)}`;
  $('selEd').hidden = !S().edits[sel];
  if (document.activeElement !== $('selNote')) $('selNote').value = S().vnotes[sel] || '';
}
document.addEventListener('keydown', ev => {
  if (!sel || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  const st = ev.shiftKey ? 5 : 1, d = { ArrowLeft: [-st, 0], ArrowRight: [st, 0], ArrowUp: [0, -st], ArrowDown: [0, st] }[ev.key];
  if (!d) return; ev.preventDefault(); const p = pt(sel); setPoint(sel, [p[0] + d[0], p[1] + d[1]]);
});
$('selReset').onclick = () => { if (!sel) return; delete S().edits[sel]; render(); showSel(); queueSave(); };
$('selNote').addEventListener('input', () => { if (!sel) return; const v = $('selNote').value; if (v) S().vnotes[sel] = v; else delete S().vnotes[sel]; queueSave(); });
$('notes').addEventListener('input', () => { S().notes = $('notes').value; queueSave(); });
$('resetAngle').onclick = () => {
  if (!resetArm) { resetArm = true; $('resetAngle').textContent = 'Click again to reset'; setTimeout(() => { resetArm = false; $('resetAngle').textContent = 'Reset this angle'; }, 3000); return; }
  resetArm = false; $('resetAngle').textContent = 'Reset this angle';
  S().edits = {}; render(); showSel(); queueSave();
};
$('copyJson').onclick = async () => {
  const a = A(), all = {}; handleKeys().forEach(([k]) => all[k] = pt(k));
  const txt = JSON.stringify({ angle: a.id, points: all, edits: S().edits, notes: S().notes, pointNotes: S().vnotes }, null, 1);
  try { await navigator.clipboard.writeText(txt); setStatus('Copied', 'ok'); } catch (e) { setStatus('Copy blocked by the browser', 'warn'); }
};
['bgPhoto', 'bgLine', 'fade', 'lyPlanes', 'lyEyes', 'lyLoomis', 'lyNeck', 'lyFar', 'lyHandles', 'lyLabels'].forEach(id => $(id).addEventListener('input', render));
function setZoom(z) { zoom = Math.max(.5, Math.min(6, z)); $('zoomLbl').textContent = (Math.round(zoom * 10) / 10) + '×'; render(); }
$('zoomIn').onclick = () => setZoom(zoom * 1.4); $('zoomOut').onclick = () => setZoom(zoom / 1.4);
$('zoomFit').onclick = fit;
function fit() { const w = $('stage').clientWidth - 2; setZoom(Math.min(w / A().w, 2.5)); }

function tabs() {
  const t = $('tabs'); t.innerHTML = '';
  DATA.angles.forEach((a, i) => {
    const b = document.createElement('button'); b.className = 'tab'; b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', i === cur);
    b.innerHTML = `${a.label}<small>${a.id} · ${a.yaw}°</small>`;
    b.onclick = () => { cur = i; sel = null; loadAngleUI(); render(); showSel(); };
    t.appendChild(b);
  });
}
function loadAngleUI() {
  tabs(); $('notes').value = S().notes || '';
  const a = A(), n = Object.keys(S().edits).length;
  $('angleInfo').textContent = `Capture ${a.id}, head yaw ${a.yaw}°. ${n} point${n === 1 ? '' : 's'} moved.`;
  try { localStorage.setItem('planes-tab', String(cur)); } catch (e) {}
}
function setStatus(t, cls) { const s = $('status'); s.textContent = t; s.className = 'status' + (cls ? ' ' + cls : ''); }
function queueSave() {
  const a = A(), n = Object.keys(S().edits).length;
  $('angleInfo').textContent = `Capture ${a.id}, head yaw ${a.yaw}°. ${n} point${n === 1 ? '' : 's'} moved.`;
  const id = a.id; clearTimeout(saveTimer); setStatus('Saving…');
  saveTimer = setTimeout(() => save(id), 600);
}
async function save(id) {
  const s = state[id], doc = { edits: s.edits, notes: s.notes, pointNotes: s.vnotes, updatedAt: new Date().toISOString() };
  if (!db) { try { localStorage.setItem('planes-' + id, JSON.stringify(doc)); setStatus('Saved in this browser only', 'warn'); } catch (e) { setStatus('Not saved', 'warn'); } return; }
  try { await db.doc('planes/' + id).set(doc); setStatus('Saved', 'ok'); } catch (e) { setStatus('Save failed: ' + (e && e.code || 'error'), 'warn'); }
}
function absorb(id, d) { if (!d) return; d = JSON.parse(JSON.stringify(d)); state[id] = { edits: d.edits || {}, notes: d.notes || '', vnotes: d.pointNotes || {} }; }

// first paint from defaults, then pull saved edits
try { const t = +localStorage.getItem('planes-tab'); if (t >= 0 && t < DATA.angles.length) cur = t; } catch (e) {}
loadAngleUI(); requestAnimationFrame(fit); showSel();
setStatus('Connecting…');
const timer = setTimeout(() => { if (!db) { setStatus('Offline: edits stay in this browser', 'warn'); localFallback(); } }, 10000);
function localFallback() { DATA.angles.forEach(a => { try { absorb(a.id, JSON.parse(localStorage.getItem('planes-' + a.id) || 'null')); } catch (e) {} }); loadAngleUI(); render(); }
(async () => {
  let d = null; try { d = window.claude && await window.claude.use('db'); } catch (e) {}
  if (!d) { clearTimeout(timer); setStatus('Offline: edits stay in this browser', 'warn'); localFallback(); return; }
  db = d;
  try {
    const snaps = await Promise.all(DATA.angles.map(a => db.doc('planes/' + a.id).get().catch(() => null)));
    snaps.forEach((s, i) => { const v = s && (typeof s.data === 'function' ? s.data() : s.data); if (v) absorb(DATA.angles[i].id, v); });
    clearTimeout(timer); setStatus('Saved', 'ok'); loadAngleUI(); render(); showSel();
  } catch (e) { clearTimeout(timer); setStatus('Could not load saved edits', 'warn'); }
})();
})();
</script>
